<header class="site-header">

  <div class="wrapper">

    <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>

    <nav class="site-nav">
      <a href="#" class="menu-icon">
        <svg viewBox="0 0 18 15">
          <path fill="#424242" d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.031C17.335,0,18,0.665,18,1.484L18,1.484z"/>
          <path fill="#424242" d="M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0c0-0.82,0.665-1.484,1.484-1.484 h15.031C17.335,6.031,18,6.696,18,7.516L18,7.516z"/>
          <path fill="#424242" d="M18,13.516C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.031C17.335,12.031,18,12.696,18,13.516L18,13.516z"/>
        </svg>
      </a>

      <div class="trigger">
        {% for my_page in site.pages %}
          {% if my_page.title %}
          <a class="page-link" href="{{ my_page.url | prepend: site.baseurl }}">{{ my_page.title | escape }}</a>
          {% endif %}
        {% endfor %}
        <button id="theme-toggle" style="background: none; border: none; cursor: pointer; padding: 0 0 0 15px; display: inline-block; vertical-align: middle; color: var(--sol-text-drk); line-height: 1;">
          <svg id="theme-icon" viewBox="0 0 24 24" width="20" height="20" style="vertical-align: middle;">
            <!-- Universal icon for theme toggle -->
            <path fill="currentColor" d="M12,18c-3.3,0-6-2.7-6-6s2.7-6,6-6s6,2.7,6,6S15.3,18,12,18z M12,8c-2.2,0-4,1.8-4,4s1.8,4,4,4s4-1.8,4-4S14.2,8,12,8z M11,4V2h2v2H11z M11,22v-2h2v2H11z M5.6,6.7L4.2,5.2l1.4-1.4L7,5.3L5.6,6.7z M18.4,18.7l-1.4-1.4l1.4-1.4l1.4,1.4L18.4,18.7z M2,13v-2h2v2H2z M20,13v-2h2v2H20z M5.6,17.3l1.4-1.4l1.4,1.4l-1.4,1.4L5.6,17.3z M18.4,5.3l1.4,1.4l-1.4,1.4L17,6.7L18.4,5.3z" />
          </svg>
        </button>
      </div>
    </nav>

  </div>

  <script>
    const toggle = document.getElementById('theme-toggle');
    toggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });
  </script>

</header>
